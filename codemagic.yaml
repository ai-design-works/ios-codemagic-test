workflows:
  ios-simulator-build:
    name: CodemagicTest - iOS Simulator Unsigned Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "CodemagicTest.xcodeproj"
        XCODE_SCHEME: "CodemagicTest"
    scripts:
      - name: Build for iOS Simulator (no code signing)
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/Build/Products/**/*.app
